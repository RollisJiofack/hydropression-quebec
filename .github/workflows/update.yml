name: Update HydroPression state

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "13 * * * *"     # toutes les heures, à h:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tzdata (pour zoneinfo America/Toronto)
        run: sudo apt-get update && sudo apt-get install -y tzdata

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pandas pyproj tzdata playwright

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Generate state
        run: cd backend && python generate_state.py

      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/etat_pression.json
          git diff --staged --quiet || git commit -m "auto: refresh state"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
