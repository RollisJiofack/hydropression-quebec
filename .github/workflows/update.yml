name: Update HydroPression state

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "13 * * * *"     # toutes les heures, à h:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pandas tzdata

      - name: Generate state (source CEHQ suivihydro)
        run: cd backend && python generate_state.py

      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/etat_pression.json
          git diff --staged --quiet || git commit -m "auto: refresh state"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Après publication : échouer le run (croix rouge = notification) si la
      # source live n'a pas répondu, SANS empêcher la publication ci-dessus.
      - name: Check data freshness
        run: |
          python - << 'PY'
          import json, sys
          d = json.load(open("web/data/etat_pression.json"))
          fs = d.get("fetch_status") or {}
          print("fetch ok :", fs.get("ok"), "| n débits live :", d.get("n_stations_debit_live"))
          print("data_stale :", d.get("data_stale"), "| âge médian (h) :", d.get("median_live_measure_age_hours"))
          if not fs.get("ok"):
              print("::error::Source CEHQ injoignable :", fs.get("error"))
              sys.exit(1)
          if d.get("data_stale"):
              print("::warning::Données publiées mais périmées (voir bandeau du site).")
          PY
