name: Update HydroPression state

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "13 * * * *"     # toutes les heures, à h:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      
      - name: Install system packages for geopandas
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev proj-data proj-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pandas pyproj tzdata python-dateutil geopandas fiona

      - name: Generate state
        run: cd backend && python generate_state.py

      - name: Verify freshness of generated JSON
        run: |
          python - <<'PY'
          import json, sys, datetime
          from dateutil import parser
          with open("web/data/etat_pression.json","r",encoding="utf-8") as f:
              j=json.load(f)
          gen=parser.isoparse(j.get("generated_at"))
          now=datetime.datetime.now(datetime.timezone.utc)
          delta=(now - gen).total_seconds()/3600.0
          print(f"Generated_at={gen.isoformat()} (delta_hours={delta:.2f})")
          if delta > 3:
              print("❌ etat_pression.json older than 3 hours")
              sys.exit(1)
          print("✅ freshness OK")
          PY
- name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/etat_pression.json
          git diff --staged --quiet || git commit -m "auto: refresh state"
          git push

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue@v5
        with:
          title: "CI: update workflow failed"
          body: "The scheduled update workflow failed for the hydropression update job. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
- name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


